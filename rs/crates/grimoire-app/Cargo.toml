[package]
name = "grimoire-app"
description = "Grimoire for Mac and Windows: player plus GPU visualizer scenes (wgpu)."
version.workspace = true
edition.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "grimoire"
path = "src/main.rs"

[dependencies]
grimoire-core.workspace = true
grimoire-audio.workspace = true
grimoire-doom.workspace = true
glam.workspace = true
bytemuck = { version = "1", features = ["derive"] }
directories = "6"
fastrand = "2"
fontdue = "0.9"
gilrs = "0.11"
muda = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.9"
wgpu = "25"
winit = "0.30"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
