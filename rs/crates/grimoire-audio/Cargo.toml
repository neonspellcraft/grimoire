[package]
name = "grimoire-audio"
description = "Grimoire playback: symphonia decoding, rubato resampling, cpal output and a lock-free tap for visualizers."
version.workspace = true
edition.workspace = true

[dependencies]
grimoire-core.workspace = true
cpal = "0.18"
rtrb = "0.3"
rubato = "0.16"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "aiff", "pcm"] }
