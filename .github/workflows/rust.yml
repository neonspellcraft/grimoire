name: Rust (macOS + Windows)

on:
  push:
    # Listing tags means branches must be listed too, or branch pushes stop triggering builds. Path filters
    # don't apply to tag pushes, so every version tag builds.
    branches: ["**"]
    tags: ["v*"]
    paths: ["rs/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rs/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows release builds are code signed by SignPath Foundation (free for open source). Signing runs on
      # version tags and manual runs once the SIGNPATH_API_TOKEN secret and SIGNPATH_ORGANIZATION_ID variable
      # are set; every other build stays unsigned. See rs/packaging/windows/SIGNING.md.
      SIGN_WINDOWS: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs

      # Includes an offscreen render of the Three-Body scene (WARP on Windows runners, which have no GPU).
      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      # A screenshot of the main window drawn on this OS (WARP on Windows), to check it looks the same.
      - name: Render UI sample
        run: cargo run --release -- --render-ui ui-${{ runner.os }}.png

      - name: Upload UI sample
        uses: actions/upload-artifact@v5
        with:
          name: ui-sample-${{ runner.os }}
          path: rs/ui-${{ runner.os }}.png

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bash scripts/fetch-freedoom.sh
          New-Item -ItemType Directory -Force dist/Grimoire/licenses | Out-Null
          Copy-Item target/release/grimoire.exe dist/Grimoire/
          Copy-Item packaging/windows/README.txt dist/Grimoire/
          Copy-Item crates/grimoire-doom/freedoom/freedoom1.wad dist/Grimoire/
          Copy-Item crates/grimoire-app/assets/animations/wizard.grma dist/Grimoire/
          Copy-Item crates/grimoire-app/assets/fonts/*-OFL.txt dist/Grimoire/licenses/
          Copy-Item crates/grimoire-doom/freedoom/COPYING.txt dist/Grimoire/licenses/Freedoom-COPYING.txt
          Copy-Item ../LICENSE dist/Grimoire/licenses/Grimoire-GPL-2.0.txt
          Compress-Archive -Path dist/Grimoire -DestinationPath dist/Grimoire-windows-x64.zip -Force

      - name: Upload unsigned Windows build for signing
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        id: unsigned
        uses: actions/upload-artifact@v5
        with:
          name: grimoire-windows-x64-unsigned
          path: rs/dist/Grimoire-windows-x64.zip

      # SignPath signs grimoire.exe inside the zip (see packaging/windows/signpath-artifact.xml) once the request is
      # approved in the SignPath web app, and hands back the zip.
      - name: Sign Windows build
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: grimoire
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-zip
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: rs/dist/signed

      - name: Use the signed Windows build
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem dist/signed -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no zip" }
          Copy-Item $signed.FullName dist/Grimoire-windows-x64.zip -Force

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: grimoire-windows-x64
          path: rs/dist/Grimoire-windows-x64.zip

      - name: Package macOS build
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: grimoire-macos
          path: rs/dist/*.dmg
